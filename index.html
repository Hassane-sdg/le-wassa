    <title>Élégance Chic</title>

    <style>
      :root {
        --primary: #c19a6b;
        --secondary: #1a1a1a;
        --light: #f5f5f5;
        --dark: #121212;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--dark), var(--secondary));
        color: var(--light);
        font-family: 'Montserrat', Arial, sans-serif;
      }
      .redirect-box {
        text-align: center;
        padding: 2rem 3rem;
        border: 1px solid rgba(193,154,107,0.4);
        border-radius: 18px;
        background: rgba(255,255,255,0.02);
        box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      }
      a {
        color: var(--primary);
      }
    </style>
  </head>
  <body>
    <div class="redirect-box">
      <h1>Élégance Chic</h1>
      <p>Redirection vers l'accueil...</p>
